spring.application.name=mycar-backend

# Configuracion local
spring.config.import=${MYCAR_ENV_FILE:file:../.env[.properties]}

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:mycar_mvp}
spring.datasource.username=${POSTGRES_USER:mycar}
spring.datasource.password=${POSTGRES_PASSWORD}

# Persistencia
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=mycar
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Migraciones exclusivas del MVP
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/mvp
spring.flyway.default-schema=mycar

# Comprobacion de disponibilidad
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

server.port=8080

# APIs de integración local (el script de desarrollo también las fuerza a true)
mycar.rf17.api-habilitada=true
mycar.rf18.api-habilitada=true
mycar.rf22.api-habilitada=true
