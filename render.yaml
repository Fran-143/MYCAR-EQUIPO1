# Blueprint Render — MyCar backend (Free) + Neon externo
# Región virginia ≈ AWS us-east-1 (Neon). Plan free = US$0.
# Secretos: SOLO Dashboard (sync: false). No poner passwords aquí.

services:
  - type: web
    name: mycar-backend
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: neon,render
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: MYCAR_AUTH_JWT_SECRET_BASE64
        sync: false
      - key: MYCAR_AUTH_ACCESS_TTL
        value: PT2H
      - key: MYCAR_AUTH_SESSION_TTL
        value: P1D
      # Correo producción: Brevo HTTPS (no SMTP). Secretos solo Dashboard.
      - key: MYCAR_VERIFICACION_MAIL_MODO
        value: brevo
      - key: MYCAR_VERIFICACION_BREVO_API_KEY
        sync: false
      - key: MYCAR_VERIFICACION_MAIL_FROM
        sync: false
      - key: MYCAR_RECUPERACION_DESARROLLO
        value: "false"
      - key: MYCAR_RF23_EVALUACION_DIARIA_HABILITADA
        value: "false"
      - key: SPRING_FLYWAY_ENABLED
        value: "false"
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=55.0 -XX:+UseSerialGC -Xss512k -XX:MaxMetaspaceSize=160m -XX:+ExitOnOutOfMemoryError"
