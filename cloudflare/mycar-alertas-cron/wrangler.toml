# Worker existente: mycar-alertas-cron (cuenta mycargarupo1 — NO crear otro).
# Primera publicación: solo SIMULAR. Cron vacío = sin programación activa.
name = "mycar-alertas-cron"
main = "src/index.js"
compatibility_date = "2024-11-01"
workers_dev = true

[vars]
BACKEND_URL = "https://mycar-backend-1dxi.onrender.com"
# Primera publicación / pruebas: SIMULAR (sin escrituras Neon/FCM).
# Activación futura COMPLETO (tras aprobación): cambiar a "COMPLETO" y redeploy.
EVAL_MODO = "SIMULAR"
MAX_ATTEMPTS = "4"
RETRY_BASE_MS = "8000"
FETCH_TIMEOUT_MS = "25000"

# Sin programación hasta autorización.
# Futuro: crons = ["10 5 * * *", "0 10 * * *"]  # 00:10 eval + 05:00 push (America/Lima = UTC-5)
[triggers]
crons = []

# Secretos (NO en este archivo):
#   npx wrangler secret put CRON_SECRET
# Debe coincidir con MYCAR_CRON_SECRET en Render.
