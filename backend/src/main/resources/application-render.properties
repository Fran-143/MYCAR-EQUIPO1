# Perfil Spring: render (usar con neon: SPRING_PROFILES_ACTIVE=neon,render)
# Hosting gratuito: puerto dinámico, pool JDBC reducido, sin .env local.

# Render inyecta PORT; escuchar en todas las interfaces (detección de puerto).
server.port=${PORT:${SERVER_PORT:8080}}
server.address=0.0.0.0

spring.config.import=optional:file:/dev/null

spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
# Fallar rápido si Neon no responde (evita colgar el arranque hasta el port-scan timeout).
spring.datasource.hikari.initialization-fail-timeout=30000

# Acelera metadata JDBC en arranque (Free CPU).
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# Correo en Render = Brevo HTTPS. No cargar JavaMail/SMTP (localhost no entrega y puede retrasar arranque).
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration,org.springframework.boot.autoconfigure.mail.MailSenderValidatorAutoConfiguration

# Seguridad API pública: no devolver códigos OTP/recuperación en JSON.
mycar.recuperacion.desarrollo=false
# Producción correo: Brevo (requerido). Vars: API_KEY + MAIL_FROM verificado.
mycar.verificacion.mail.modo=${MYCAR_VERIFICACION_MAIL_MODO:brevo}
mycar.verificacion.brevo.api-key=${MYCAR_VERIFICACION_BREVO_API_KEY:}
mycar.verificacion.brevo.from-name=${MYCAR_VERIFICACION_BREVO_FROM_NAME:MyCar}
mycar.verificacion.brevo.base-url=${MYCAR_VERIFICACION_BREVO_BASE_URL:https://api.brevo.com}
mycar.verificacion.mail.from=${MYCAR_VERIFICACION_MAIL_FROM:}

# Hereda de neon: ddl-auto=validate, flyway.enabled=false, rf23 job off, health mínimo.
# RF23 diario: Cloudflare Worker → POST /api/v1/interno/alertas/evaluar-programadas
# (MYCAR_CRON_SECRET). No activar evaluacion-diaria-habilitada aquí.
# Auth: el secreto JWT es obligatorio en el panel (MYCAR_AUTH_JWT_SECRET_BASE64).
# TTL con defaults seguros — sin ellos SessionCredentials lanza AUTENTICACION_NO_DISPONIBLE (503).
mycar.auth.jwt-secret-base64=${MYCAR_AUTH_JWT_SECRET_BASE64:}
mycar.auth.access-ttl=${MYCAR_AUTH_ACCESS_TTL:PT2H}
mycar.auth.session-ttl=${MYCAR_AUTH_SESSION_TTL:P1D}

# FCM obligatorio en Render: un solo bean (FcmPushSender). Sin SA el arranque falla explícito.
mycar.fcm.habilitado=true
# Transición segura: tick 15s ENCENDIDO pero solo 05:00–21:59 Lima (drain todas las categorías).
# Tras validar cron Cloudflare 05:00, poner worker-habilitado=false (sin gap: cron ya activo).
mycar.fcm.worker-habilitado=true
mycar.fcm.simular-envio=false
