spring.application.name=mycar-backend

# Configuracion local (optional: no tumba el arranque en contenedor/hosting sin .env)
spring.config.import=${MYCAR_ENV_FILE:optional:file:../.env[.properties]}

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:mycar_mvp}
spring.datasource.username=${POSTGRES_USER:mycar}
spring.datasource.password=${POSTGRES_PASSWORD}

# Persistencia
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=mycar
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Migraciones exclusivas del MVP
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/mvp
spring.flyway.default-schema=mycar

# Comprobacion de disponibilidad
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# El fallo SMTP no debe tumbar /actuator/health (el envío se reporta en el adaptador).
management.health.mail.enabled=false

server.port=8080

# Fotos licencia/SOAT (ValidadorLicencia: imagen ≤5MB, PDF ≤10MB). Default Spring=1MB rompe USB.
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=25MB

# APIs de integración local (el script de desarrollo también las fuerza a true)
mycar.rf17.api-habilitada=true
mycar.rf18.api-habilitada=true
mycar.rf22.api-habilitada=true
mycar.rf34.api-habilitada=true
mycar.rf46.api-habilitada=true

# Documentos privados:
#   modo=fake      → tests / sin credenciales
#   modo=supabase  → Storage real (requiere url + secret en .env; ver docs/soat_supabase_env.md)
mycar.documentos.modo=${MYCAR_DOCUMENTOS_MODO:fake}
mycar.documentos.supabase.url=${MYCAR_DOCUMENTOS_SUPABASE_URL:}
mycar.documentos.supabase.secret=${MYCAR_DOCUMENTOS_SUPABASE_SECRET:}
mycar.documentos.supabase.bucket=${MYCAR_DOCUMENTOS_SUPABASE_BUCKET:mycar-documentos-privados}

# Fotos privadas de perfil/vehículo (bucket separado de evidencias documentales)
#   modo=fake      → tests / sin credenciales
#   modo=supabase  → Storage privado (MYCAR_FOTOS_*)
mycar.fotos.modo=${MYCAR_FOTOS_MODO:fake}
mycar.fotos.supabase.url=${MYCAR_FOTOS_SUPABASE_URL:${MYCAR_DOCUMENTOS_SUPABASE_URL:}}
mycar.fotos.supabase.secret=${MYCAR_FOTOS_SUPABASE_SECRET:${MYCAR_DOCUMENTOS_SUPABASE_SECRET:}}
mycar.fotos.supabase.bucket=${MYCAR_FOTOS_SUPABASE_BUCKET:mycar-fotos-privadas}

mycar.datos-sensibles.enabled=${MYCAR_DATOS_SENSIBLES_ENABLED:false}
mycar.datos-sensibles.key-id=${MYCAR_DATOS_SENSIBLES_KEY_ID:v1}
mycar.datos-sensibles.aes-key=${MYCAR_DATOS_SENSIBLES_AES_KEY:}
mycar.datos-sensibles.blind-key=${MYCAR_DATOS_SENSIBLES_BLIND_KEY:}

# RF02 MFA TOTP (ADMIN). Fail-closed si falta la clave al mutar/validar MFA.
mycar.mfa.enabled=${MYCAR_MFA_ENABLED:true}
mycar.mfa.key-id=${MYCAR_MFA_KEY_ID:v1}
mycar.mfa.aes-key=${MYCAR_MFA_AES_KEY:}
mycar.mfa.issuer=MyCar
mycar.mfa.max-intentos=${MYCAR_MFA_MAX_INTENTOS:5}
mycar.mfa.bloqueo=PT10M
mycar.mfa.desafio-ttl=PT5M
mycar.mfa.admin-session-ttl=PT15M
mycar.mfa.recovery-count=8
mycar.mfa.bootstrap-secret=${MYCAR_ADMIN_BOOTSTRAP_SECRET:}
# Local/USB: true solo con secreto. Render: false (ver application-render.properties).
mycar.mfa.bootstrap-enabled=${MYCAR_ADMIN_BOOTSTRAP_ENABLED:true}

# RF01 verificación: desarrollo (default) expone codigoDesarrollo en la API.
# SMTP local: modo=smtp + spring.mail.* (ver .env.example).
# Brevo HTTPS (Render): modo=brevo + mycar.verificacion.brevo.api-key + mail.from verificado.
mycar.verificacion.mail.modo=desarrollo
# RF03: en desarrollo la API puede incluir codigoDesarrollo (nunca credencial universal).
mycar.recuperacion.desarrollo=true
# USB/local: el primer login con un correo nuevo crea la cuenta (sin OTP). En Render = false.
mycar.auth.login-auto-alta=true
# Perfil local (sin neon/render): abortar si el datasource no es 127.0.0.1/localhost.
mycar.seguridad.exigir-datasource-local=true
# Simulador de correo/OTP y fixtures RF (solo local). En neon/render debe quedar false.
mycar.local-test.enabled=true
mycar.local-test.qa-token=mycar-local-qa
# Alineado con PrivacyPolicyConfiguration.academicLocal() (Android debug)
mycar.registro.privacidad.version-vigente=1.0

# RF23: evaluación diaria además del sync al abrir Mis alertas (no sustituye el sync puntual).
mycar.rf23.evaluacion-diaria-habilitada=true
mycar.rf23.evaluacion-diaria-cron=0 15 3 * * *

# RF43: recordatorios de kilometraje → solo notificaciones internas (no alertas).
mycar.rf43.evaluacion-habilitada=true
mycar.rf43.evaluacion-cron=0 30 4 * * *

# Cron externo (Cloudflare Worker): secreto de servicio, independiente de JWT.
# En Render definir MYCAR_CRON_SECRET. Vacío ⇒ el endpoint interno rechaza toda llamada.
mycar.cron.secret=${MYCAR_CRON_SECRET:}

# FCM / push: habilitado=true exige SA (un bean FCM). habilitado=false → un bean NoOp.
# Render (perfil render) fuerza habilitado=true. No registrar ambos a la vez.
mycar.fcm.habilitado=false
mycar.fcm.worker-habilitado=false
mycar.fcm.simular-envio=false
mycar.fcm.forzar-ventana=false
mycar.fcm.worker-delay-ms=15000
mycar.fcm.worker-lote=25
mycar.fcm.credentials-json=${MYCAR_FCM_CREDENTIALS_JSON:}
mycar.fcm.credentials-base64=${MYCAR_FCM_CREDENTIALS_BASE64:}
mycar.fcm.credentials-path=${MYCAR_FCM_CREDENTIALS_PATH:}

# Taller piloto local (número SOLO por env; nunca en Git). habilitado=false por defecto.
mycar.taller-piloto.habilitado=false
mycar.taller-piloto.nombre=Taller Piloto MyCar
mycar.taller-piloto.whatsapp=${MYCAR_TALLER_PILOTO_WHATSAPP:}
# Obligatorio (>0) si habilitado=true. Sin default fijo de usuario.
mycar.taller-piloto.usuario-id=${MYCAR_TALLER_PILOTO_USUARIO_ID:0}
# Solo true con autorización explícita de prueba; default false.
mycar.taller-piloto.contacto-autorizado=${MYCAR_TALLER_PILOTO_CONTACTO_AUTORIZADO:false}
# Secreto admin catálogo oficial (header X-MyCar-Taller-Admin-Secret). Vacío = admin deshabilitado.
mycar.taller-admin.secret=${MYCAR_TALLER_ADMIN_SECRET:}

# Planes: pago sandbox (hasta que admin apague) + prueba gratuita (14d auto). Sin cobros reales.
mycar.planes.sandbox.enabled=true
mycar.planes.sandbox.vigencia=${MYCAR_PLANES_SANDBOX_VIGENCIA:ILIMITADA}
# Local: false → admin aprueba.
mycar.planes.sandbox.activacion-inmediata=${MYCAR_PLANES_SANDBOX_ACTIVACION_INMEDIATA:false}
mycar.planes.prueba-gratuita.enabled=${MYCAR_PLANES_PRUEBA_ENABLED:true}
mycar.planes.prueba-gratuita.vigencia=${MYCAR_PLANES_PRUEBA_VIGENCIA:P14D}
# 0 = no configurado. Local demo permite 3 pruebas por cuenta.
# Regla de negocio: 1 prueba gratuita por cuenta (toda la vida). Env solo para override local extremo.
mycar.planes.prueba-gratuita.max-por-usuario=${MYCAR_PLANES_PRUEBA_MAX:1}
# Job local de vencimiento (America/Lima). Neon/Render: false.
mycar.planes.vencimiento-job.enabled=true
mycar.planes.vencimiento-job.cron=0 20 3 * * *

# Mercado Pago Checkout Pro TEST (apagado sin credenciales).
mycar.mercadopago.test.enabled=${MYCAR_MP_TEST_ENABLED:false}
mycar.mercadopago.test.access-token=${MYCAR_MP_TEST_ACCESS_TOKEN:}
mycar.mercadopago.test.public-key=${MYCAR_MP_TEST_PUBLIC_KEY:}
mycar.mercadopago.test.webhook-secret=${MYCAR_MP_TEST_WEBHOOK_SECRET:}
mycar.mercadopago.test.success-url=${MYCAR_MP_TEST_SUCCESS_URL:}
mycar.mercadopago.test.pending-url=${MYCAR_MP_TEST_PENDING_URL:}
mycar.mercadopago.test.failure-url=${MYCAR_MP_TEST_FAILURE_URL:}
mycar.mercadopago.test.api-base=https://api.mercadopago.com
