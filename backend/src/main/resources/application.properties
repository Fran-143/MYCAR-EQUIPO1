spring.application.name=mycar-backend

# Configuracion local (optional: no tumba el arranque en contenedor/hosting sin .env)
spring.config.import=${MYCAR_ENV_FILE:optional:file:../.env[.properties]}

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:mycar_mvp}
spring.datasource.username=${POSTGRES_USER:mycar}
spring.datasource.password=${POSTGRES_PASSWORD}

# Persistencia
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=mycar
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Migraciones exclusivas del MVP
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/mvp
spring.flyway.default-schema=mycar

# Comprobacion de disponibilidad
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
# El fallo SMTP no debe tumbar /actuator/health (el envío se reporta en el adaptador).
management.health.mail.enabled=false

server.port=8080

# APIs de integración local (el script de desarrollo también las fuerza a true)
mycar.rf17.api-habilitada=true
mycar.rf18.api-habilitada=true
mycar.rf22.api-habilitada=true
mycar.rf34.api-habilitada=true
mycar.rf46.api-habilitada=true

# RF01 verificación: desarrollo (default) expone codigoDesarrollo en la API.
# SMTP real: en ../.env pon mycar.verificacion.mail.modo=smtp + spring.mail.* (ver .env.example).
mycar.verificacion.mail.modo=desarrollo
# RF03: en desarrollo la API puede incluir codigoDesarrollo (nunca credencial universal).
mycar.recuperacion.desarrollo=true
# Alineado con PrivacyPolicyConfiguration.academicLocal() (Android debug)
mycar.registro.privacidad.version-vigente=1.0

# RF23: evaluación diaria además del sync al abrir Mis alertas (no sustituye el sync puntual).
mycar.rf23.evaluacion-diaria-habilitada=true
mycar.rf23.evaluacion-diaria-cron=0 15 3 * * *

# FCM / push (Admin SA vía env: MYCAR_FCM_CREDENTIALS_BASE64 o path). Sin SA → NoOp.
mycar.fcm.habilitado=true
mycar.fcm.worker-habilitado=true
mycar.fcm.worker-delay-ms=15000
mycar.fcm.worker-lote=25
mycar.fcm.credentials-json=${MYCAR_FCM_CREDENTIALS_JSON:}
mycar.fcm.credentials-base64=${MYCAR_FCM_CREDENTIALS_BASE64:}
mycar.fcm.credentials-path=${MYCAR_FCM_CREDENTIALS_PATH:}
