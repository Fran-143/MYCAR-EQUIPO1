spring.application.name=mycar-backend

# Leer las variables del archivo .env
spring.config.import=file:../.env[.properties]

# Conexion con PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:mycar}
spring.datasource.username=${POSTGRES_USER:mycar}
spring.datasource.password=${POSTGRES_PASSWORD}

# Persistencia
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=mycar
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Migraciones
spring.flyway.enabled=true
spring.flyway.default-schema=mycar

# Estado del backend
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

server.port=8080
