# Perfil Spring: neon
# Uso: SPRING_PROFILES_ACTIVE=neon + SPRING_DATASOURCE_* (ver .env.neon.example)
# No altera el arranque Docker (perfil por defecto).

# Validación de esquema restaurado; sin DDL automático.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=mycar

# Primera validación: no reaplicar migraciones sobre el historial restaurado.
spring.flyway.enabled=false

# Evitar job Spring RF23 en Neon/Render: el disparo diario lo hace Cloudflare Worker.
mycar.rf23.evaluacion-diaria-habilitada=false
# Secreto del Worker (mismo valor en Cloudflare CRON_SECRET).
mycar.cron.secret=${MYCAR_CRON_SECRET:}

# Local/Neon sin SA: NoOp exclusivo (mutuamente excluyente con FcmConfiguration).
# En Render el perfil "render" fuerza mycar.fcm.habilitado=true + SA.
mycar.fcm.habilitado=false
mycar.fcm.worker-habilitado=false

# Health sin detalles; fallo de correo no tumba /actuator/health.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false

