# Perfil Spring: neon
# Uso: SPRING_PROFILES_ACTIVE=neon + SPRING_DATASOURCE_* (ver .env.neon.example)
# No altera el arranque Docker (perfil por defecto).

# Validación de esquema restaurado; sin DDL automático.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=mycar

# Primera validación: no reaplicar migraciones sobre el historial restaurado.
spring.flyway.enabled=false

# Evitar escrituras programadas RF23 contra Neon durante pruebas.
mycar.rf23.evaluacion-diaria-habilitada=false

# Outbox push puede correr en Neon/Render; sin SA queda en NoOp.
mycar.fcm.worker-habilitado=true

# Health sin detalles; fallo de correo no tumba /actuator/health.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.mail.enabled=false

